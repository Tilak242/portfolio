:root{color-scheme:dark;--ink:#07080b;--text:#f2f3f7;--dim:#a3a7b3;--line:rgba(255,255,255,.14);--glow:#a9b8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;background:radial-gradient(ellipse at 70% 30%,#151a33 0%,var(--ink) 60%);color:var(--text);font-family:"SF Pro Display",Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

a.card{display:block;padding:24px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--text);background:rgba(255,255,255,.03)}
a.card:hover,a.card:focus-visible{border-color:var(--glow);outline:none}
a.card b{display:block;font-size:24px;letter-spacing:-.01em}
a.card span{color:var(--dim);font-size:15px;display:block;margin-top:6px}
